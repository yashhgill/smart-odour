name = "odour-router"
main = "src/index.js"
compatibility_date = "2026-05-01"
account_id = "52c1d557ffffc7359a34d5ddeffc037d"

# Cron probe every minute -> uptime_samples + offline-node detection
[triggers]
crons = ["* * * * *"]

# Raw telemetry archive (replaces S3)
[[r2_buckets]]
binding = "RAW"
bucket_name = "smart-odour-raw"

# Telemetry + operational store (replaces Neon)
[[d1_databases]]
binding = "DB"
database_name = "smart-odour"
database_id = "ee34669b-70dd-436c-bd6e-3b335cff48b2"

# Live fan-out to connected dashboards
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveFeed"

# Password hashing runs in here rather than in the Worker. A Worker request on
# the free plan is capped at 10ms CPU, which PBKDF2 blows through; a Durable
# Object request gets 30s. This is what makes 210k iterations possible for free.
[[durable_objects.bindings]]
name = "AUTHGATE"
class_name = "AuthGate"

# MUST be new_sqlite_classes. The free plan only supports SQLite-backed
# Durable Objects; new_classes creates the key-value backend and fails.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveFeed", "AuthGate"]

# Router state + alert cooldowns
[[kv_namespaces]]
binding = "STATE"
id = "3153fe3b5409420c83c07c98b5e678ce"

# Non-secret vars. Everything sensitive goes through `wrangler secret put`.
[vars]
ENVIRONMENT = "production"
# Comma-separated list of exact origins allowed to call this API.
# Credentialed CORS cannot use "*", so every host the portals are served from
# must appear here verbatim, scheme included and no trailing slash.
# Keep the pages.dev entry even after adding a custom domain — Pages preview
# builds still resolve there and you will want them working.
ALLOWED_ORIGINS = "https://smart-odour.pages.dev,https://odour.harnova.my"

# Linked from every Telegram alert.
DASHBOARD_URL = "https://odour.harnova.my"
# 100000 is Cloudflare's hard ceiling for PBKDF2. Anything higher throws
# "iteration counts above 100000 are not supported" at runtime. The code clamps
# to this regardless, so a wrong value here degrades rather than breaks login.
AUTH_ITERATIONS = "100000"

# Render compute sidecar. Leave unset and forecasting plus PDF export simply
# stay unavailable — nothing else is affected.
COMPUTE_BASE = "https://odour-compute.onrender.com"

# Required secrets:
#   wrangler secret put DEVICE_KEY            # shared HMAC secret with the ESP32
#   wrangler secret put ADMIN_TOKEN           # gates ESG report generation
#   wrangler secret put RESEND_API_KEY        # alert email (optional)
#   wrangler secret put ALERT_EMAIL           # where threshold alerts go
#   wrangler secret put TELEGRAM_BOT_TOKEN       # from @BotFather
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET  # any random string; proves
#                                                # inbound calls are Telegram's
#   wrangler secret put TELEGRAM_CHAT_ID         # optional legacy single chat
#   wrangler secret put SERVICE_TOKEN         # shared with the Render sidecar
